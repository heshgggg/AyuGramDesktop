
name: Build tdesktop (Docker)
on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository (with submodules)
        run: git clone --recursive https://github.com/AyuGram/AyuGramDesktop.git

      - name: Show workspace
        run: pwd && ls -la

      - name: Ensure docker available
        uses: docker/setup-buildx-action@v3 
            

      - name: Build inside centos_env container
        env:
          TDESKTOP_API_ID: '2040'
          TDESKTOP_API_HASH: 'b18441a1ff607e10a989891a5462e627'
        run: |
          cd AyuGramDesktop && \
          pwd && ls -la && \
          python3 -m venv venv && \
          source venv/bin/activate && \
          pip install poetry && \
          ./Telegram/build/prepare/linux.sh && \
          docker run --rm -it \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG="$CONFIG" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
            -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH}

      - name: List build output
        working-directory: ./AyuGramDesktop
        run: |
          echo "Contents of tdesktop/out:"
          ls -la out || true

      - name: Upload build artifact (out/)
        uses: actions/upload-artifact@v4
        with:
          name: tdesktop-out
          path: tdesktop/out
